<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Group for shared stroke styling: Color, Width, and Rounded ends/joins -->
  <g stroke="#f26b21" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Outer "G" shape and bottom-right crossbar -->
    <!--
      M 94.72 55      : Start at top-right opening
      A 45 45 0 1 0 50 95 : Draw large circular arc to bottom-center
      L 75 95         : Straight line rightwards along bottom
      A 10 10 0 0 0 85 85 : Rounded corner curving up
      L 85 75         : Vertical stem
      M 75 75 L 95 75 : Horizontal crossbar of the "G"
    -->
    <path d="M 94.72 55 A 45 45 0 1 0 50 95 L 75 95 A 10 10 0 0 0 85 85 L 85 75 M 75 75 L 95 75" />

    <!-- Inner audio waveform bars -->
    <path d="M 35 35 L 35 65 M 50 25 L 50 75 M 65 35 L 65 65" />

  </g>
</svg>
